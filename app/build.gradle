plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def storeFileName = keystoreProps.getProperty('storeFile', 'keystore/aurora-release.jks')
def storePasswordValue = keystoreProps.getProperty('storePassword', 'AuroraLight2026!')
def keyAliasValue = keystoreProps.getProperty('keyAlias', 'aurora')
def keyPasswordValue = keystoreProps.getProperty('keyPassword', storePasswordValue)
def updateUrl = project.findProperty('AURORA_UPDATE_URL') ?: 'https://YOUR_GITHUB_USER.github.io/aurora-light/update.json'

android {
    namespace 'com.aurora.light'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aurora.light'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '1.0.9'
        buildConfigField 'String', 'UPDATE_URL', '"' + updateUrl + '"'
    }

    signingConfigs {
        release {
            storeFile rootProject.file(storeFileName)
            storePassword storePasswordValue
            keyAlias keyAliasValue
            keyPassword keyPasswordValue
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            // 开发时也用项目签名，避免 debug 包覆盖安装 release 包时签名冲突
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
